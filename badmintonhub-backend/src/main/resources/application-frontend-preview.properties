# Opt-in, ephemeral environment for reviewing the React frontend. Never activate in production.
spring.datasource.url=jdbc:h2:mem:frontend-preview;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.cache.type=simple
spring.devtools.restart.enabled=false
app.security.jwt-secret=${APP_SECURITY_JWT_SECRET}
app.preview.password=${BADMINTON_PREVIEW_PASSWORD}
